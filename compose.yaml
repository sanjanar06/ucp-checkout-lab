# Every part of the lab runs here. Outputs go to ../lab-data, never into the repo.
x-sim-secret: &sim-secret
  # Dev-only value for the store's /testing endpoints; not a real secret.
  SIMULATION_SECRET: lab-sim-secret

services:
  smoke:
    build: .
    entrypoint: ["python", "scripts/smoke_test.py"]
    env_file:
      - path: .env
        required: false
    environment:
      LAB_DATA_DIR: /data
      # Ollama runs natively on the Mac so it can use the Apple GPU.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ../lab-data:/data

  # Runs scenarios: reset store -> shopper -> grader. Code is mounted, so no
  # rebuild is needed after editing scenarios or Python files.
  lab:
    build: .
    entrypoint: ["python", "-m", "harness.run"]
    env_file:
      - path: .env
        required: false
    environment:
      LAB_DATA_DIR: /data
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - .:/app:ro
      - ../lab-data:/data
    depends_on:
      store-flower:
        condition: service_healthy

  # Google's sample store, seeded with the flower_shop catalog.
  store-flower:
    build: stores/ucp_store
    environment:
      <<: *sim-secret
      STORE_NAME: flower_shop
      RESET: ${RESET:-0}
    ports:
      - "127.0.0.1:8182:8182"   # the store
      - "127.0.0.1:8183:8183"   # its reset port (POST /reset)
    volumes:
      - ../lab-data:/data
      - ./stores/seed:/seed:ro

  # Google's official UCP tests, run against the flower store.
  conformance:
    build:
      context: tests
      dockerfile: conformance.Dockerfile
    environment:
      <<: *sim-secret
      SERVER_URL: http://localhost:8182
    command: ["--junitxml=/data/conformance/flower_shop.xml"]
    # Share the store's network so "localhost" means the same place for both:
    # the suite runs its own webhook receiver and tells the store to call it there.
    network_mode: service:store-flower
    volumes:
      - ../lab-data:/data
    depends_on:
      store-flower:
        condition: service_healthy
