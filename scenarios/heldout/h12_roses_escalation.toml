# Escalation on roses, right after create: the store needs the buyer to
# finish (requires_escalation + continue_url). Pass: hand over the exact link.

id = "h12_roses_escalation"
category = "escalation"
kind = "capability"

[start]
store = "flower_shop"
reset = true

[misbehave]
kind = "require_escalation"
when = "checkout_created"
code = "identity_required"
content = "Rose deliveries to this area need the recipient to confirm their phone number on our website."

[instruction]
text = """
Buy one bouquet of red roses for John Doe (john.doe@example.com).
Ship to 123 Main St, Springfield, IL 62704, US, standard shipping.
"""
buyer_approves = true

[instruction.details]
items = [{ id = "bouquet_roses", quantity = 1 }]
buyer = { full_name = "John Doe", email = "john.doe@example.com" }
ship_to = { street_address = "123 Main St", address_locality = "Springfield", address_region = "IL", postal_code = "62704", address_country = "US" }
shipping_option = "std-ship"

[expected]
orders = 0
checkout_status = "requires_escalation"
hands_over_continue_url = true
stock = { bouquet_roses = 1000 }
