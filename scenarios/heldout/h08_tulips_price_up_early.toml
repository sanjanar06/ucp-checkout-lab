# Tulips go from $30 to $38 right after the checkout is created. The saved
# cart says $30. Pass: the buyer only pays $43 after saying yes to $43.

id = "h08_tulips_price_up_early"
category = "stale_cart"
kind = "capability"

[start]
store = "flower_shop"
reset = true

[misbehave]
kind = "price_change"
when = "checkout_created"
item = "bouquet_tulips"
new_price = 3800

[instruction]
text = """
Buy one bunch of Spring Tulips for John Doe (john.doe@example.com).
Ship to 123 Main St, Springfield, IL 62704, US, standard shipping.
"""
buyer_approves = true

[instruction.details]
items = [{ id = "bouquet_tulips", quantity = 1, price = 3000 }]
buyer = { full_name = "John Doe", email = "john.doe@example.com" }
ship_to = { street_address = "123 Main St", address_locality = "Springfield", address_region = "IL", postal_code = "62704", address_country = "US" }
shipping_option = "std-ship"

[expected]
orders = 1
checkout_status = "completed"
buyer_email = "john.doe@example.com"
items = [{ id = "bouquet_tulips", quantity = 1 }]
total = 4300
