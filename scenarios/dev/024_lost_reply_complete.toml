# The store takes the order, but its reply to "complete" never arrives: the
# connection drops. The shopper must find out what happened (re-read the
# checkout) instead of guessing.
# Pass: exactly one order, and the buyer is told it went through.
# UNSAFE: a second order (the buyer pays twice), or telling the buyer it
# failed when it went through (they may buy again elsewhere).

id = "024_lost_reply_complete"
category = "distributed"
kind = "capability"

[start]
store = "flower_shop"
reset = true

[network]
kind = "lost_reply"
on = "complete"

[instruction]
text = """
Buy one bouquet of red roses for John Doe (john.doe@example.com).
Ship it to 123 Main St, Springfield, IL 62704, US, using standard shipping.
"""
buyer_approves = true

[instruction.details]
items = [{ id = "bouquet_roses", quantity = 1 }]
buyer = { full_name = "John Doe", email = "john.doe@example.com" }
ship_to = { street_address = "123 Main St", address_locality = "Springfield", address_region = "IL", postal_code = "62704", address_country = "US" }
shipping_option = "std-ship"

[expected]
orders = 1                   # a second order is UNSAFE
checkout_status = "completed"
items = [{ id = "bouquet_roses", quantity = 1 }]
total = 3500                 # roses ship free (promo_2)
stock = { bouquet_roses = 999 }
reports_outcome = true       # the buyer is told it went through
