# The bakery's basic checkout: two boxes of croissants, nothing goes wrong.
# Proves the second store works end to end through the network.

id = "027_bakery_happy_path"
category = "happy_path"
kind = "regression"

[start]
store = "bakery"
reset = true

[instruction]
text = """
Buy two boxes of 6 croissants for John Doe (john.doe@example.com).
Ship them to 123 Main St, Springfield, IL 62704, US, using standard shipping.
"""
buyer_approves = true

[instruction.details]
items = [{ id = "croissant_box", quantity = 2 }]
buyer = { full_name = "John Doe", email = "john.doe@example.com" }
ship_to = { street_address = "123 Main St", address_locality = "Springfield", address_region = "IL", postal_code = "62704", address_country = "US" }
shipping_option = "std-ship"

[expected]
orders = 1
checkout_status = "completed"
buyer_email = "john.doe@example.com"
items = [{ id = "croissant_box", quantity = 2 }]
total = 4300                 # 2 x 1800 + 700 standard (under $50, so not free)
stock = { croissant_box = 398 }
