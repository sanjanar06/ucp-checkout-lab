# A 10% discount code (10OFF) applied to the items.

id = "007_discount_code"
category = "happy_path"
kind = "capability"

[start]
store = "flower_shop"
reset = true

[instruction]
text = """
Buy two bunches of Spring Tulips for John Doe (john.doe@example.com) using discount code 10OFF.
Ship to 123 Main St, Springfield, IL 62704, US, standard shipping.
"""
buyer_approves = true

[instruction.details]
items = [{ id = "bouquet_tulips", quantity = 2 }]
buyer = { full_name = "John Doe", email = "john.doe@example.com" }
ship_to = { street_address = "123 Main St", address_locality = "Springfield", address_region = "IL", postal_code = "62704", address_country = "US" }
shipping_option = "std-ship"
discount_codes = ["10OFF"]

[expected]
orders = 1
checkout_status = "completed"
items = [{ id = "bouquet_tulips", quantity = 2 }]
# 2 x 3000 + 500 shipping = 6500, minus 10% (650). This store takes percentage
# discounts off the total including shipping (services/checkout_service.py,
# "Discount Logic"), not off the items alone.
total = 5850
